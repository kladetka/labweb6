<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Popup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page">
<div class="popup-wrap">
    <input class="popup-toggle" type="checkbox" id="popup-toggle" aria-label="Відкрити/закрити попап">
    <label class="popup-button" for="popup-toggle">Іконки</label>

    <div class="popup">
        <div class="popup-body" tabindex="0">
            <ul class="icons">
                <li><a class="icon" href="#">🏠<span>Home</span></a></li>
                <li><a class="icon" href="#">⭐<span>Star</span></a></li>
                <li><a class="icon" href="#">✉️<span>Mail</span></a></li>
                <li><a class="icon" href="#">⚙️<span>Settings</span></a></li>
                <li><a class="icon" href="#">🔍<span>Search</span></a></li>
                <li><a class="icon" href="#">🔔<span>Alerts</span></a></li>
                <li class="extra"><a class="icon" href="#">📷<span>Photo</span></a></li>
                <li class="extra"><a class="icon" href="#">🎵<span>Music</span></a></li>
                <li class="extra"><a class="icon" href="#">📅<span>Calendar</span></a></li>
                <li class="extra"><a class="icon" href="#">🔒<span>Lock</span></a></li>
                <li class="extra"><a class="icon" href="#">☁️<span>Cloud</span></a></li>
                <li class="extra"><a class="icon" href="#">📁<span>Files</span></a></li>
                <li class="extra"><a class="icon" href="#">❤️<span>Like</span></a></li>
                <li class="extra"><a class="icon" href="#">🛒<span>Cart</span></a></li>
            </ul>
        </div>
        <input class="more-toggle" type="checkbox" id="more-toggle" aria-label="Показати більше">
        <label class="more-button" for="more-toggle">More</label>
    </div>
</div>
</body>
</html>
